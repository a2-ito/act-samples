name: reusable_boolean

on:
  workflow_call:
    inputs:
      str:
        required: true
        type: string
      bool:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      str:
        required: true
        type: string
        default: "true"
      bool:
        required: true
        type: boolean
        default: true

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - name: echo1
        run: |
          echo ${{ inputs.str }}
          echo ${{ inputs.bool }}

      - name: echo2
        if: ${{ inputs.str == 'true' }}
        run: |
          echo "true!"

      - name: echo3
        if: ${{ inputs.str }}
        run: |
          echo "true!!"

      - name: echo4
        if: ${{ inputs.bool == true }}
        run: |
          echo "true!!!"

      - name: echo5
        if: ${{ inputs.bool }}
        run: |
          echo "true!!!!"
