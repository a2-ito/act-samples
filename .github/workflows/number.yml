name: number

on:
  workflow_dispatch:

jobs:

  init:
    runs-on: ubuntu-latest
    outputs:
      VAL: ${{ steps.env.outputs.VAL }}
    steps:
    - name: Initialize env values
      id: env
      run: |
        echo "VAL=2" >> $GITHUB_OUTPUT
 
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "Val1=1" >> $GITHUB_ENV
          echo "Val2=${{ 1 }}" >> $GITHUB_ENV

      - name: print
        run: |
          echo ${{ env.Val1 }}
          echo ${{ env.Val2 }}

      - name: verify Val1
        run: |
          if [ ${{ env.Val1 }} -eq 1 ]; then
            echo "Val1 is number"
          else
            echo "Val1 is not number"
          fi

      - name: verify Val2
        run: |
          if [ ${{ env.Val2 }} -eq 1 ]; then
            echo "Val2 is number"
          else
            echo "Val2 is not number"
          fi

      - name: action
        uses: ./.github/actions/number
        with:
          val: ${{ env.Val1 }}

  number:
    needs: init
    uses: ./.github/workflows/reusable_number.yml
    with:
      val: ${{ needs.init.outputs.VAL }}

